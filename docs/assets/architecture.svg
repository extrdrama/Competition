eight="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.75"/><text x="571.0" y="229" font-size="13.5" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">APK / wxapkg</text><text x="571.0" y="239" font-size="11" fill="#378ADD" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">解包取字符串</text><path d="M340 272 L340 288" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="292" width="600" height="92" rx="12" fill="#E6F1FB" stroke-dasharray="6 4" stroke-width="1.5"/><rect x="56" y="317" width="84" height="26" rx="13" fill="#185FA5"/><text x="98" y="330" font-size="13" fill="#FFFFFF" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">检测层</text><rect x="486" y="300" width="140" height="20" rx="10" fill="#185FA5"/><text x="556" y="310" font-size="11" fill="#FFFFFF" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">核心 · 四层收敛漏斗</text><rect x="150" y="330" width="120" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.75"/><text x="210.0" y="345" font-size="13.5" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">① 格式命中</text><text x="210.0" y="355" font-size="11" fill="#854F0B" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">32088 候选</text><rect x="284" y="330" width="120" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.75"/><text x="344.0" y="345" font-size="13.5" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">② 上下文确认</text><text x="344.0" y="355" font-size="11" fill="#854F0B" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">334</text><rect x="418" y="330" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.75"/><text x="468.0" y="345" font-size="13.5" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">③ 评分+去重</text><text x="468.0" y="355" font-size="11" fill="#854F0B" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">178</text><rect x="530" y="330" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.75"/><text x="585.0" y="345" font-size="13.5" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">④ 唯一凭据</text><text x="585.0" y="355" font-size="11" fill="#854F0B" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">165 · 掩码落盘</text><path d="M270 350 L280 350" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M404 350 L414 350" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M518 350 L526 350" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="40" y="398" font-size="11" fill="#475569" font-family="sans-serif" dominant-baseline="central">195 条自研规则 + 结构化解析 + 熵兜底；占位符过滤与可解释评分把 3.2 万候选收敛到 165 条真凭据（收敛比 1:194）</text><path d="M340 386 L340 424" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="428" width="600" height="64" rx="12" fill="#E6F1FB"/><rect x="56" y="453" width="84" height="26" rx="13" fill="#185FA5"/><text x="98" y="466" font-size="13" fill="#FFFFFF" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">验证层</text><rect x="150" y="440" width="470" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.75"/><text x="385.0" y="455" font-size="13.5" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">16 个只读验活器（默认关闭）</text><text x="385.0" y="465" font-size="11" fill="#378ADD" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">AWS SigV4 / 阿里云 / 腾讯云 签名自实现 · 全局限速 · 只查身份不碰资源</text><path d="M340 492 L340 532" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="536" width="600" height="76" rx="12" fill="#E6F1FB"/><rect x="56" y="561" width="84" height="26" rx="13" fill="#185FA5"/><text x="98" y="574" font-size="13" fill="#FFFFFF" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">输出层</text><rect x="150" y="552" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.75"/><text x="200.0" y="567" font-size="13.5" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">指纹去重</text><text x="200.0" y="577" font-size="11" fill="#378ADD" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">HMAC-SHA256</text><rect x="262" y="552" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.75"/><text x="317.0" y="567" font-size="13.5" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">凭据对关联</text><text x="317.0" y="577" font-size="11" fill="#378ADD" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">组合升级 critical</text><rect x="384" y="552" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.75"/><text x="439.0" y="567" font-size="13.5" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">归属 + 处置</text><text x="439.0" y="577" font-size="11" fill="#378ADD" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">可复制修复片段</text><rect x="506" y="552" width="120" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.75"/><text x="566.0" y="567" font-size="13.5" fill="#0C447C" font-weight="500" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">MTTD 统计</text><text x="566.0" y="577" font-size="11" fill="#854F0B" text-anchor="middle" font-family="sans-serif" dominant-baseline="central">最快 2.4 分钟</text><text x="40" y="636" font-size="11" fill="#475569" font-family="sans-serif" dominant-baseline="central">全程只读公开内容 · 凭据明文不落盘（仅掩码 + HMAC 指纹） · 65 个单元测试全绿</text><text x="640" y="636" font-size="11" fill="#378ADD" font-weight="500" text-anchor="end" font-family="sans-serif" dominant-baseline="central">输出：报告 / 可视化看板</text></svg>