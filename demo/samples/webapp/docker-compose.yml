# 演示样本，凭据均为伪造值
version: "3.9"
services:
  api:
    image: registry.internal-demo.example.com/api:2.4.1
    environment:
      - DATABASE_URL=postgresql://api_user:Pr0d_xJYLv619qcS6@postgres:5432/app
      - REDIS_PASSWORD=MfZ01F1xYQzhRJYPGHnB
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: Pr0d_xJYLv619qcS6
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: redis-server --requirepass MfZ01F1xYQzhRJYPGHnB

volumes:
  pgdata:
